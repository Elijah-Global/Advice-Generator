<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice Generator App</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
</head>
<body>
    <main class="container">
        <div class="advice-card">
            <h1 class="advice-title">ADVICE #<span id="advice-id"></span></h1>
            <p class="advice-text">"<span id="advice-quote"></span>"</p>
            <img src="/advice-generator-app-main/images/pattern-divider-desktop.svg" alt="" class="divider desktop-divider">
            <img src="/advice-generator-app-main/images/pattern-divider-mobile.svg" alt="" class="divider mobile-divider">
            <button class="dice-button" id="dice-button">
                <img src="/advice-generator-app-main/images/icon-dice.svg" alt="dice icon">
            </button>
        </div>
    </main>
    <script src="/script.js"></script>
</body>
</html>
